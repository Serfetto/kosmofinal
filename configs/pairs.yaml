# Сопоставление полевых событий со снимками. Читается pipeline/pairs.py; обоснование — plan.md §5.3.

catalog: https://planetarycomputer.microsoft.com/api/stac/v1
collection: sentinel-2-l2a
# Наш детектор использует красный край (B05–B07): для Landsat только учёт в реестре
unsupported_collections: [landsat-c2-l2]

search_window_days: 1        # кандидаты: дата события ±1 сут.

# Ярусы синхронизации по максимальному |t_снимка − t_наблюдения|, ч
sync:
  tier_a_max_h: 3            # время известно, сдвиг мал — пара для количественного сравнения
  tier_b_max_h: 18           # тот же день (время неизвестно или сдвиг несколько часов) — только исследование
  # больше — UNRELIABLE_SYNC: пара остаётся как контекст

# Дрейфовый буфер: max|dt| × (течение + windage × ветер ERA5)
drift:
  current_ms: 0.3            # исторических течений в Open-Meteo для дат событий нет — консервативная оценка
  current_source: default_conservative
  windage: 0.02              # как в pipeline/drift.py для моря
  max_feature_buffer_km: 5   # признаки детектора считаются не дальше этого буфера от следа

quality:
  min_coverage: 0.9          # доля следа с буфером, покрытая данными сцены
  min_clear_water: 0.5       # доля чистой воды (SCL = 6) среди морских пикселей следа
  max_glint_b11: 0.03        # медиана B11 по чистой воде; выше — сильный блик
  scl_bad: [0, 1, 3, 8, 9, 10, 11]

# Мини-акватории вокруг принятых пар для признаков детектора
chip_min_km: 6
