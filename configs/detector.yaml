# Пороги детектора и статусов. Читаются pipeline/detect.py и pipeline/aggregate.py.
# Порог P задан до проверки на MARIDA test (подбор на val — только для базовых алгоритмов).

p_det: 0.5                 # вероятность класса «мусор»
all_flags: 7               # пена (1) + соседи (2) + CFAR 5σ (4) — все фильтры пройдены
storm_wind_ms: 8.0         # ≥: барашки неотличимы от мусора → только крупные скопления, «недостаточно данных»
rough_wind_ms: 6.0
ice_frac: 0.005            # >0,5% акватории подо льдом — сцена ненадёжна
min_scene_valid: 0.3       # сцена с меньшей долей видимой воды пропускается
min_hex_valid: 0.5         # гекс с меньшей долей видимой воды — «недостаточно данных»
glint_b11: 0.03            # отражение B11 над водой выше — сильный блик (для маски качества)
glint_scene_frac: 0.3      # >30% воды под бликом — сцена ненадёжна: только крупные скопления, «недостаточно данных»
cloud_buffer_px: 10         # детекции ближе 100 м к облаку или тени не считаем (края облаков)
zone_merge_px: 1           # детекции ближе (пикс.) объединяются в одну зону
